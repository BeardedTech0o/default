name: Lint
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jq:
    name: JQ
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate
        run: jq --raw-output . appdaemon blacklist critical integration netdaemon plugin python_script removed template theme

  jsonschema:
    name: JSON schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Critical
        uses: cardinalby/schema-validator-action@2166123eb256fa40baef7e22ab1379708425efc7 # 3.1.1
        with:
          file: "critical"
          schema: "tools/jsonschema/critical.schema.json"

      - name: Repositories
        uses: cardinalby/schema-validator-action@2166123eb256fa40baef7e22ab1379708425efc7 # 3.1.1
        with:
          file: "appdaemon|blacklist|integration|netdaemon|plugin|python_script|template|theme"
          schema: "tools/jsonschema/repositories.schema.json"

      - name: Removed
        uses: cardinalby/schema-validator-action@2166123eb256fa40baef7e22ab1379708425efc7 # 3.1.1
        with:
          file: "removed"
          schema: "tools/jsonschema/removed.schema.json"

  sorted:
    name: Sorted
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Check lists
        run: python3 scripts/is_sorted.py
